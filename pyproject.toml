[project]
name = "cosyne2026-adaptive-behavior"
version = "0.1.0"
description = "Figure-generation environment for the COSYNE 2026 abstract"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "python-pptx",
    "scipy",
    "seaborn",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_behavior"]

[tool.uv]
package = true
